name: Страйкбол-дайджест

on:
  schedule:
    - cron: "0 4 * * *"   # каждый день в 09:00 по Екатеринбургу (UTC+5)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # База уже виденных новостей хранится в кэше между запусками.
      - uses: actions/cache@v4
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: seen-db-

      - name: Собрать дайджест
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m airsoft_news --send-telegram

      - uses: actions/upload-artifact@v4
        with:
          name: digest
          path: output/
          retention-days: 30
